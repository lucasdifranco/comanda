<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comanda</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0b; color: #eee; font: 14px system-ui, sans-serif; display: flex; justify-content: center; padding: 48px 16px; }
  main { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-size: 20px; margin: 0; }
  p { color: #aaa; margin: 0; }
  label { display: flex; flex-direction: column; gap: 6px; color: #ccc; }
  input { background: #161616; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 9px 10px; font: 13px monospace; }
  button { padding: 9px 14px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; cursor: pointer; font: inherit; }
  .recent button { background: #161616; border-color: #333; text-align: left; width: 100%; font: 12px monospace; }
  .recent { display: flex; flex-direction: column; gap: 6px; }
  #err { color: #f87171; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1>Comanda</h1>
  <p>Enter the repository and the URL of the site running in dev. The site opens here with the "Edit" button.</p>
  <form id="f">
    <label>Repository folder <input id="repo" required placeholder="D:/code/my-site"></label><br>
    <label>Site URL <input id="url" placeholder="http://localhost:8081"></label><br>
    <p>An app without hot reload (Python, Go, a binary) takes a command, and a command runs a shell: give it to the agent, which has the token. This page cannot set one.</p><br>
    <button>Open</button>
  </form>
  <div id="err"></div>
  <div class="recent" id="recent"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  async function open(repo, url) {
    const r = await fetch('/__le/target', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ repo, url }) });
    if (r.ok) location.href = '/';
    else $('err').textContent = await r.text() || `error ${r.status}`;
  }
  $('f').onsubmit = (e) => {
    e.preventDefault();
    if (!$('url').value.trim()) { $('err').textContent = 'enter the site URL'; return; }
    open($('repo').value.trim(), $('url').value.trim());
  };
  fetch('/__le/config').then((r) => r.json()).then((c) => {
    if (c.current) { $('repo').value = c.current.repo; $('url').value = c.current.url || ''; }
    for (const t of c.recent) {
      if (t.cmd) continue; // supervised app: set by the agent, the command needs the token
      const b = document.createElement('button');
      b.textContent = `${t.url ? ` ${t.url}` : ''}  ->  ${t.repo}`;
      b.onclick = (e) => { e.preventDefault(); open(t.repo, t.url || ''); };
      $('recent').appendChild(b);
    }
  });
</script>
</body>
</html>
